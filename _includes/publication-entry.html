<article class="publication-entry" id="{{ include.paper.id | escape }}">
  <p class="publication-authors">{{ include.paper.authors | join: ', ' | escape }}</p>
  <h3>{{ include.paper.title | escape }}</h3>
  <p class="publication-venue"><em>{{ include.paper.venue | escape }}</em>, {{ include.paper.year }}</p>
  <div class="action-links">
    {% if include.paper.pdf %}<a class="text-link" href="{{ include.paper.pdf | relative_url }}">PDF <span aria-hidden="true">↗</span></a>{% endif %}
    {% if include.paper.doi %}<a class="text-link" href="https://doi.org/{{ include.paper.doi | escape }}">DOI <span aria-hidden="true">↗</span></a>{% endif %}
    {% if include.paper.arxiv %}<a class="text-link" href="https://arxiv.org/abs/{{ include.paper.arxiv | escape }}">arXiv <span aria-hidden="true">↗</span></a>{% endif %}
  </div>
</article>
