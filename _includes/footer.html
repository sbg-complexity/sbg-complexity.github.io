<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <p class="footer-label">{{ site.title | escape }}</p>
      <p>{{ site.affiliation | escape }}</p>
    </div>
    <div class="footer-contact">
      <a href="mailto:{{ site.contact_email | escape }}">{{ site.contact_email | escape }}</a>
      <p class="draft-note">{{ site.disclaimer | escape }}</p>
    </div>
  </div>
</footer>
