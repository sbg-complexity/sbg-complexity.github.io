<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <p class="footer-label">{{ site.title | escape }}</p>
      <p>{{ site.affiliation | escape }}</p>
    </div>
    <div class="footer-contact">
      <a href="mailto:{{ site.contact_email | escape }}">{{ site.contact_email | escape }}</a>
      <p class="draft-note">{{ site.disclaimer | escape }}</p>
    </div>
    <section class="footer-sponsors" aria-labelledby="sponsor-heading">
      <h2 id="sponsor-heading" class="eyebrow">Sponsors and institutional partners</h2>
      <ul class="sponsor-list">
        {% for sponsor in site.data.sponsors %}
          <li><a href="{{ sponsor.url | escape }}"><img src="{{ sponsor.image | relative_url }}" alt="{{ sponsor.image_alt | escape }}" loading="lazy"></a></li>
        {% endfor %}
      </ul>
    </section>
    <nav class="footer-legal" aria-label="Legal information">
      <a href="{{ '/legal-notice/' | relative_url }}">Legal notice</a>
      <a href="{{ '/imprint/' | relative_url }}">Imprint</a>
      <a href="{{ '/data-policy/' | relative_url }}">Data policy</a>
    </nav>
  </div>
</footer>
