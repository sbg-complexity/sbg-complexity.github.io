<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
      <span class="wordmark-mark" aria-hidden="true">S<span>·</span>C</span>
      <span class="wordmark-text">{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/research/' | relative_url }}"{% if page.url contains '/research' %} aria-current="page"{% endif %}>Research</a></li>
        <li><a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} aria-current="page"{% endif %}>Publications</a></li>
        <li><a href="{{ '/team/' | relative_url }}"{% if page.url contains '/team' %} aria-current="page"{% endif %}>Team</a></li>
        <li><a href="{{ '/outreach/' | relative_url }}"{% if page.url contains '/outreach' %} aria-current="page"{% endif %}>Outreach</a></li>
      </ul>
    </nav>
  </div>
</header>
