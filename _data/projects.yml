- slug: macbeh
  name: MACBeh
  category: ERC Starting Grant project
  logo: /assets/img/research-groups/macbeh.png
  logo_alt: MACBeh wordmark
  url: https://www.macbeh.com/
  summary: >-
    MACBeh (Model Adaptation in the Study of Critical Behavior) investigates how
    and why models from physics are adapted to explain critical behavior in
    biological and social systems. The project studies what makes such transfers
    successful and how models change when used in new disciplinary contexts.
  involvement: >-
    The Salzburg Complexity Group's work engages the project's central themes of
    model adaptation and critical behavior.
  publications: [philosophy-of-biophysics, idealizations-in-physics]
- slug: knowledge-in-crisis
  name: Knowledge in Crisis
  category: FWF Cluster of Excellence
  logo: /assets/img/research-groups/knowledge-in-crisis.svg
  logo_alt: Knowledge in Crisis wordmark
  url: https://www.knowledgeincrisis.com/
  summary: >-
    Knowledge in Crisis brings together more than 50 philosophers across the
    Central European University and the universities of Salzburg, Graz, and
    Vienna to study contemporary crises of knowledge, truth, and expertise.
    The Cluster also aims to strengthen philosophical research and communicate
    its findings beyond the university.
  involvement: >-
    Patricia Palacios works on questions of universality. Rawad El Skaf is a
    Fellow of the Cluster.
  publications: []
