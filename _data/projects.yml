- slug: macbeh
  name: MACBeh
  primary: true
  category: ERC Starting Grant project
  logo: /assets/img/research-groups/macbeh.png
  logo_alt: MACBeh wordmark
  url: https://www.macbeh.com/
  summary: >-
    MACBeh (Model Adaptation in the Study of Critical Behavior) examines how
    models developed in physics are transferred and adapted for use in other
    domains, particularly in the study of biological and social systems. It asks
    what changes in these transfers and under what conditions cross-domain model
    use can illuminate critical behavior.
  involvement: >-
    The Salzburg Complexity Group's work engages the project's central themes of
    model adaptation and critical behavior.
  publications: [philosophy-of-biophysics, idealizations-in-physics]
- slug: knowledge-in-crisis
  name: Knowledge in Crisis
  category: FWF Cluster of Excellence
  logo: /assets/img/research-groups/knowledge-in-crisis.svg
  logo_alt: Knowledge in Crisis wordmark
  url: https://www.knowledgeincrisis.com/
  summary: >-
    Knowledge in Crisis investigates contemporary crises of knowledge, truth,
    and expertise. Its research examines what knowledge is, how knowledge claims
    are justified, whether scientific knowledge has distinctive authority, and
    how knowledge and expertise function in social and political life. The Cluster
    connects these questions across epistemology, philosophy of science, ethics,
    and political and social philosophy.
  involvement: >-
    Patricia Palacios is a Key Researcher whose work examines universality in
    science. Rawad El Skaf is a Cluster Fellow working on climate science at the
    science-policy interface.
  publications: []
