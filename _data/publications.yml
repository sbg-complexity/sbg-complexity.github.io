- id: philosophy-of-biophysics
  authors: [Margarida Hermida, Patricia Palacios]
  title: Philosophy of Biophysics
  venue: Cambridge Element, under contract with Cambridge University Press
  status: forthcoming
  summary: >-
    This Element examines biophysics at the intersection of physics and biology,
    arguing that physical research can illuminate molecular and cellular
    mechanisms and deepen understanding of life and the individual and collective
    behavior of living organisms.
  url: https://www.macbeh.com/publications
- id: idealizations-in-physics
  authors: [Patricia Palacios]
  title: Idealizations in Physics
  venue: Chapter in Comprehensive Philosophy of Science, edited by Sven Ove Hansson and Alistair Wilson, Elsevier
  status: forthcoming
  summary: >-
    The chapter distinguishes forms of idealization in physics and the different
    epistemic roles they play. It examines how idealizations connect to debates
    about reductionism and scientific realism, including their role in models of
    criticality.
  url: https://www.macbeh.com/publications
