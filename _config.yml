title: Salzburg Complexity Group
description: The Salzburg Complexity Group investigates the philosophical foundations of complex systems, scientific modeling, emergence, uncertainty, values, and critical transitions.
tagline: How models travel across disciplines to explain complex systems.
intro: >-
  Drawing on philosophy of science and physics, we examine emergence, uncertainty,
  values in science, and the transfer of models across disciplines. Our work spans
  complex systems in biological, social, and socio-ecological contexts, with
  particular attention to critical transitions.
logo_credit: María Trigos
disclaimer: >-
  This is an internal-review draft. Project, publication, and event listings are illustrative.
contact_email: patricia.palacios@plus.ac.at
affiliation: Department of Philosophy, University of Salzburg
