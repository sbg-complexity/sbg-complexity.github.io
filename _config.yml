title: Salzburg Complexity Group
description: Research on model adaptation across disciplines, complex systems, and critical behavior.
tagline: How models travel across disciplines to explain complex systems.
intro: >-
  We study how scientific models are transferred and adapted across disciplinary
  boundaries to investigate complex systems, including critical behavior and
  transitions. Our work examines what these transfers preserve, how they change,
  and when they provide sound explanations.
disclaimer: >-
  This is an internal-review draft. Project, publication, and event listings are illustrative.
contact_email: jiang.zhang@plus.ac.at
affiliation: Department of Philosophy, University of Salzburg
noindex: true
